[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teakit"
dynamic = ["version"]
description = "Techno-economic analysis of chemical process plants, on public DOE/NETL and NREL methodology. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "A. Lotfollahzade Moghaddam", email = "alotfollahzade95@gmail.com" }]
keywords = [
    "techno-economic analysis", "TEA", "process economics", "cost estimation",
    "chemical engineering", "CEPCI", "NETL", "NREL", "levelized cost",
    "discounted cash flow", "capital cost", "minimum selling price",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

# No runtime dependencies. This is deliberate: teakit runs on a stock Python in
# an air-gapped plant office, and every dependency is a future portability
# problem. Charts render to SVG from the standard library; the graphical
# application is http.server plus vanilla JavaScript.
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]     # only for ChartSpec.to_matplotlib()
dev = ["pytest>=7", "pytest-cov", "ruff"]
# The native window. Not required for the browser interface, which needs
# nothing beyond the standard library.
desktop = ["pywebview>=5"]
# Building the downloadable Windows application. Developer-side only.
build = ["pyinstaller>=6", "pywebview>=5"]

[project.urls]
Homepage = "https://github.com/alotfi73/teakit"
Documentation = "https://github.com/alotfi73/teakit#readme"
Source = "https://github.com/alotfi73/teakit"
Issues = "https://github.com/alotfi73/teakit/issues"

[project.scripts]
teakit = "teakit.cli:main"
teakit-desktop = "teakit.app.desktop:main"

[tool.hatch.version]
path = "src/teakit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/teakit"]

# The CSVs in src/teakit/data and the interface in src/teakit/app/static live
# inside the package tree, so hatchling ships them with the package. They are
# listed here only to make that explicit and to fail loudly if it stops being
# true. tests/test_app.py checks they are reachable from an installed copy.
[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/LICENSE",
           "/CHANGELOG.md", "/CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules --ignore=src/teakit/app/static"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 92
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
