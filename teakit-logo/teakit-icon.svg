<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>teakit</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2F57"/><stop offset="0.55" stop-color="#0C4A6B"/><stop offset="1" stop-color="#0B7A75"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B3D"/><stop offset="1" stop-color="#FFC24B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- axes: cost vs design variable -->
  <path d="M80 84 V428 H436" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- capital cost falls -->
  <path d="M104 150 Q150 372 428 396" fill="none" stroke="#6FD3C8" stroke-opacity="0.8" stroke-width="7" stroke-linecap="round"/>
  <!-- operating cost rises -->
  <path d="M104 404 Q300 398 428 262" fill="none" stroke="#6FD3C8" stroke-opacity="0.8" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 15"/>
  <!-- optimum drop line -->
  <line x1="262" y1="344" x2="262" y2="414" stroke="#FFC24B" stroke-width="7" stroke-dasharray="1 15" stroke-linecap="round"/>
  <!-- the plant: a distillation column sitting at the optimum -->
  <path d="M262 142 V118 H334 V150" fill="none" stroke="#FFC24B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="334" cy="168" r="18" fill="#0F2F57" stroke="#FFC24B" stroke-width="9"/>
  <path d="M322 174 L330 160 L338 176 L346 162" fill="none" stroke="#FFC24B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M230 318 V162 C230 142 294 142 294 162 V318 Z" fill="url(#amber)"/>
  <g stroke="#0F2F57" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <line x1="244" y1="176" x2="280" y2="176"/><line x1="244" y1="200" x2="280" y2="200"/><line x1="244" y1="224" x2="280" y2="224"/><line x1="244" y1="248" x2="280" y2="248"/><line x1="244" y1="272" x2="280" y2="272"/><line x1="244" y1="296" x2="280" y2="296"/>
  </g>
  <!-- total cost: the U -->
  <path d="M106 92 C136 290 196 322 262 322 C334 322 392 282 432 196" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  <!-- the optimum -->
  <circle cx="262" cy="322" r="24" fill="#FFC24B" stroke="#0F2F57" stroke-width="8"/>
  <circle cx="262" cy="322" r="7" fill="#0F2F57"/>
</svg>
