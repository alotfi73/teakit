name: Release

# Builds the two downloadable applications and the PyPI artifacts, and attaches
# them to a GitHub release.
#
#   teakit-<version>-windows.zip    double-click .exe, nothing to install
#   teakit-<version>-portable.zip   browser application, any OS with Python 3.10+
#   teakit-<version>-portable.tar.gz  same, but preserves the executable bit
#                                     that macOS needs on the .command launcher
#   teakit-<version>.whl / .tar.gz  for `pip install teakit`
#
# Trigger by pushing a tag (`git tag v2.0.0 && git push --tags`), or by hand
# from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------
  # The Windows application. PyInstaller cannot cross-compile, so this
  # genuinely has to run on a Windows runner.
  # --------------------------------------------------------------------
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[build]"
      - run: python packaging/build_windows.py --zip --clean
      - name: Smoke-test the built executable
        shell: bash
        run: |
          # A frozen build fails at runtime, not at build time — usually on a
          # data file that did not make it into the bundle. Start it and make
          # it do real work before publishing.
          exe="dist/teakit-$(python -c 'import sys;sys.path.insert(0,"src");import teakit;print(teakit.__version__)')-windows/teakit.exe"
          "$exe" --browser --debug &
          sleep 15
          curl -sf http://127.0.0.1:8765/health
          curl -sf -X POST http://127.0.0.1:8765/api/demo \
               -H 'Content-Type: application/json' -d '{"kind":"methanol"}' -o demo.json
          python - <<'PY'
          import json, urllib.request
          p = json.load(open("demo.json"))["project"]
          p.update(currency="EUR", exchange_rate=0.9, exchange_rate_source="test")
          req = urllib.request.Request(
              "http://127.0.0.1:8765/api/run",
              data=json.dumps({"project": p}).encode(),
              headers={"Content-Type": "application/json"})
          r = json.loads(urllib.request.urlopen(req).read())
          assert r["ok"], r
          assert r["result"]["equipment_rows"], "no equipment - data files missing?"
          assert r["result"]["currency"] == "EUR"
          print("frozen build runs a full study")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/*.zip

  # --------------------------------------------------------------------
  # The portable browser application. Pure Python, so any runner will do.
  # --------------------------------------------------------------------
  portable-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python packaging/build_portable.py --zip
      - name: Smoke-test the portable bundle
        run: |
          version=$(python -c 'import sys;sys.path.insert(0,"src");import teakit;print(teakit.__version__)')
          cd "dist/teakit-$version-portable"
          python teakit-app.py --no-browser &
          sleep 6
          curl -sf http://127.0.0.1:8765/health
          curl -sf http://127.0.0.1:8765/app.js -o /dev/null
          echo "portable bundle serves"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-app
          path: |
            dist/*.zip
            dist/*.tar.gz

  # --------------------------------------------------------------------
  # The library, for `pip install teakit`.
  # --------------------------------------------------------------------
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: wheel, path: dist/ }

  # --------------------------------------------------------------------
  release:
    needs: [windows-app, portable-app, wheel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Download

            | You want | Get |
            |---|---|
            | The app on Windows, nothing to install | `teakit-*-windows.zip` — unzip, double-click `teakit.exe` |
            | The app on macOS or Linux | `teakit-*-portable.tar.gz` — unzip, double-click `Launch teakit.command` (needs Python 3.10+) |
            | To use it from your own scripts | `pip install teakit` |

            The Windows app and the browser app are the same program with a
            different window. Estimates are computed in USD on a US Gulf Coast
            basis; a non-USD reporting currency is a conversion applied to the
            finished figure.
